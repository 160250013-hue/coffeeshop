<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App UI</title>
    <!-- Font Awesome Icons Link -->
     <link rel="stylesheet" href="https://cloudflare.com" />
    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wrapper">
        <header>Todo App</header>
        
        <!-- Input Field Container -->
        <div class="input-field">
            <input type="text" placeholder="Add your new todo">
            <button><i class="fa-solid fa-plus"></i></button>
        </div>

        <!-- Todo List Items -->
        <ul class="todo-list">
            <li>Buy a new gaming laptop</li>
            <li>Complete a previous task <span class="icon"><i class="fa-solid fa-trash"></i></span></li>
            <li>Create video for YouTube</li>
            <li>Create a new portfolio site</li>
        </ul>

        <!-- Footer / Pending Tasks -->
        <div class="footer">
            <span>You have <span class="pending-num">4</span> pending tasks</span> 
            <button>Clear All</button>
        </div>
    </div>

</body>
</html>
